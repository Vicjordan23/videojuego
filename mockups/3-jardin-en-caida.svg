<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" font-family="Helvetica,Arial,sans-serif">
  <rect width="360" height="640" fill="#eaf4e2"/>
  <!-- HUD -->
  <text x="20" y="46" fill="#1f4d2b" font-size="24" font-weight="700">Día 12</text>
  <text x="20" y="66" fill="#4f7a5a" font-size="12">Flores: 38 · Cadena x3</text>
  <rect x="246" y="26" width="94" height="52" rx="10" fill="#fff"/>
  <text x="293" y="44" fill="#4f7a5a" font-size="10" text-anchor="middle">SIGUIENTE</text>
  <circle cx="278" cy="61" r="10" fill="#ff7aa8"/><circle cx="308" cy="61" r="10" fill="#ffc94a"/>
  <!-- board -->
  <rect x="30" y="96" width="300" height="450" rx="14" fill="#c9a37a"/>
  <rect x="38" y="104" width="284" height="434" rx="10" fill="#7a5233"/>
  <!-- tiles: 6 cols x 9 rows, 44px -->
  <g>
    <!-- falling pair -->
    <circle cx="127" cy="138" r="19" fill="#ff7aa8"/><circle cx="127" cy="182" r="19" fill="#ffc94a"/>
    <!-- stack rows (y centers 226..490) -->
    <g fill="#ffc94a"><circle cx="83" cy="490" r="19"/><circle cx="127" cy="490" r="19"/><circle cx="215" cy="446" r="19"/></g>
    <g fill="#ff7aa8"><circle cx="171" cy="490" r="19"/><circle cx="171" cy="446" r="19"/><circle cx="83" cy="446" r="19"/></g>
    <g fill="#8a6bff"><circle cx="215" cy="490" r="19"/><circle cx="259" cy="490" r="19"/><circle cx="259" cy="446" r="19"/><circle cx="127" cy="446" r="19"/></g>
    <g fill="#5ad19a"><circle cx="171" cy="402" r="19"/><circle cx="127" cy="402" r="19"/></g>
    <!-- blooming flower -->
    <g transform="translate(215 402)">
      <circle r="8" fill="#fff" opacity=".9"/>
      <g fill="#ff7aa8"><circle cx="0" cy="-14" r="8"/><circle cx="13" cy="-4" r="8"/><circle cx="8" cy="11" r="8"/><circle cx="-8" cy="11" r="8"/><circle cx="-13" cy="-4" r="8"/></g>
      <circle r="7" fill="#ffc94a"/>
    </g>
    <!-- weeds rising from the bottom -->
    <g fill="#3f7f3a"><rect x="60" y="520" width="240" height="14" rx="5"/></g>
    <g stroke="#3f7f3a" stroke-width="3" stroke-linecap="round"><path d="M75 520 v-8 M105 520 v-12 M150 520 v-7 M200 520 v-11 M245 520 v-8 M280 520 v-12"/></g>
  </g>
  <!-- ghost drop guide -->
  <line x1="127" y1="204" x2="127" y2="384" stroke="#fff" stroke-width="2" stroke-dasharray="4 6" opacity=".6"/>
  <text x="180" y="580" fill="#1f4d2b" font-size="13" text-anchor="middle">Une 3 del mismo color para que florezcan</text>
  <text x="180" y="602" fill="#4f7a5a" font-size="12" text-anchor="middle">La maleza sube cada 10 semillas</text>
  <text x="180" y="626" fill="#4f7a5a" font-size="11" text-anchor="middle">DESLIZA ↔ MOVER · TOCA ↻ GIRAR · ↓ CAER</text>
</svg>
