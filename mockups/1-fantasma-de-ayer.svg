<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140f2e"/><stop offset="1" stop-color="#2b1250"/>
    </linearGradient>
  </defs>
  <rect width="360" height="640" fill="url(#bg)"/>
  <!-- HUD -->
  <text x="20" y="48" fill="#ffffff" font-size="26" font-weight="700">1.284 m</text>
  <text x="20" y="68" fill="#9d8fd6" font-size="12">RECORD 2.310 m</text>
  <rect x="236" y="28" width="104" height="30" rx="15" fill="#3a2270"/>
  <text x="288" y="48" fill="#ff5fd2" font-size="13" font-weight="700" text-anchor="middle">4 FANTASMAS</text>
  <!-- distant skyline -->
  <g fill="#1d1445">
    <rect x="0" y="380" width="50" height="140"/><rect x="60" y="340" width="40" height="180"/>
    <rect x="110" y="400" width="60" height="120"/><rect x="180" y="350" width="45" height="170"/>
    <rect x="240" y="390" width="55" height="130"/><rect x="305" y="360" width="55" height="160"/>
  </g>
  <!-- platforms -->
  <rect x="0" y="500" width="150" height="14" rx="4" fill="#5b3fb8"/>
  <rect x="200" y="470" width="160" height="14" rx="4" fill="#5b3fb8"/>
  <rect x="0" y="600" width="360" height="40" fill="#3a2270"/>
  <!-- ghost trails -->
  <g fill="#ff5fd2">
    <circle cx="70" cy="480" r="14" opacity=".22"/>
    <circle cx="105" cy="466" r="14" opacity=".30"/>
    <circle cx="140" cy="452" r="14" opacity=".38"/>
    <circle cx="238" cy="452" r="14" opacity=".5"/>
  </g>
  <!-- ghost (enemy) -->
  <g transform="translate(238 452)">
    <path d="M-14 0 a14 14 0 0 1 28 0 v14 l-7 -5 l-7 5 l-7 -5 l-7 5z" fill="#ff5fd2" opacity=".85"/>
    <circle cx="-5" cy="-1" r="2.5" fill="#140f2e"/><circle cx="5" cy="-1" r="2.5" fill="#140f2e"/>
  </g>
  <text x="238" y="426" fill="#ff5fd2" font-size="11" text-anchor="middle">Tú, hace 3 min</text>
  <!-- player -->
  <circle cx="150" cy="440" r="16" fill="#3df2e0"/>
  <circle cx="156" cy="437" r="3" fill="#140f2e"/>
  <path d="M120 440 h-30 M124 450 h-40" stroke="#3df2e0" stroke-width="3" stroke-linecap="round" opacity=".5"/>
  <!-- coins -->
  <g fill="#ffd84a"><circle cx="290" cy="420" r="7"/><circle cx="315" cy="410" r="7"/><circle cx="340" cy="420" r="7"/></g>
  <!-- tap hint -->
  <text x="180" y="626" fill="#c9bdf5" font-size="13" text-anchor="middle">TOCA PARA SALTAR · MANTÉN PARA PLANEAR</text>
</svg>
