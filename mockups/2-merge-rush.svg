  <ellipse cx="163" cy="500" rx="14" ry="8" fill="#fff" opacity=".5"/>
  <circle cx="166" cy="512" r="5" fill="#3b1408"/><circle cx="194" cy="512" r="5" fill="#3b1408"/>
  <text x="180" y="546" font-size="22" font-weight="700" fill="#3b1408" text-anchor="middle">34</text>
