  <rect x="0" y="0" width="20" height="640" fill="#ff8fc7"/><rect x="340" y="0" width="20" height="640" fill="#ff8fc7"/>
  <g fill="#fff" opacity=".7"><circle cx="10" cy="60" r="4"/><circle cx="10" cy="200" r="4"/><circle cx="10" cy="340" r="4"/><circle cx="10" cy="480" r="4"/><circle cx="350" cy="120" r="4"/><circle cx="350" cy="280" r="4"/><circle cx="350" cy="440" r="4"/></g>
