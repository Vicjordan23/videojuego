    <rect x="20" y="330" width="190" height="24" rx="12"/><rect x="250" y="330" width="90" height="24" rx="12"/>
  </g>
  <g fill="#7a4a00"><circle cx="60" cy="162" r="3"/><circle cx="90" cy="162" r="3"/><circle cx="250" cy="162" r="3"/><circle cx="290" cy="162" r="3"/><circle cx="80" cy="342" r="3"/><circle cx="130" cy="342" r="3"/><circle cx="280" cy="342" r="3"/><circle cx="310" cy="342" r="3"/></g>
  <!-- spiky critters -->
  <g fill="#ff5c6c" stroke="#a5202f" stroke-width="2"><polygon points="20,240 44,254 20,268"/><polygon points="340,250 316,264 340,278"/></g>
  <!-- player with face -->
  <circle cx="225" cy="452" r="34" fill="#e8f9ff" stroke="#fff" stroke-width="4"/>
  <ellipse cx="212" cy="438" rx="9" ry="5" fill="#fff"/>
  <circle cx="214" cy="456" r="4" fill="#2a2a55"/><circle cx="238" cy="456" r="4" fill="#2a2a55"/>
  <path d="M220 468q6 6 12 0" fill="none" stroke="#2a2a55" stroke-width="3" stroke-linecap="round"/>
  <circle cx="205" cy="466" r="5" fill="#ff8fc7" opacity=".7"/><circle cx="247" cy="466" r="5" fill="#ff8fc7" opacity=".7"/>
  <!-- HUD -->
  <rect x="110" y="26" width="140" height="56" rx="28" fill="#fff"/>
  <text x="180" y="62" fill="#2a2a55" font-size="28" font-weight="700" text-anchor="middle">856 m</text>
  <rect x="36" y="566" width="288" height="18" rx="9" fill="#fff" opacity=".8"/>
  <rect x="36" y="566" width="80" height="18" rx="9" fill="#ff8fc7"/>
  <text x="180" y="616" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">¡Mantén para hincharte!</text>
