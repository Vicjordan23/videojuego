<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" font-family="'Trebuchet MS',Verdana,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fe3ff"/><stop offset="1" stop-color="#5aa9ff"/></linearGradient>
  </defs>
  <rect width="360" height="640" fill="url(#bg)"/>
  <!-- clouds -->
  <g fill="#fff" opacity=".8"><ellipse cx="70" cy="230" rx="44" ry="18"/><ellipse cx="100" cy="220" rx="30" ry="18"/><ellipse cx="290" cy="410" rx="44" ry="18"/><ellipse cx="315" cy="400" rx="26" ry="16"/></g>
