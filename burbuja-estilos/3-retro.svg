  <g fill="#5b5bd6"><rect x="60" y="200" width="4" height="4"/><rect x="290" y="240" width="4" height="4"/><rect x="120" y="400" width="4" height="4"/><rect x="250" y="520" width="4" height="4"/><rect x="80" y="520" width="4" height="4"/></g>
  <!-- brick walls -->
  <g fill="#7a3b1d"><rect x="0" y="0" width="24" height="640"/><rect x="336" y="0" width="24" height="640"/></g>
  <g fill="#b85c2c">
    <rect x="0" y="0" width="24" height="8"/><rect x="0" y="16" width="24" height="8"/><rect x="0" y="32" width="24" height="8"/><rect x="0" y="48" width="24" height="8"/>
    <rect x="336" y="0" width="24" height="8"/><rect x="336" y="16" width="24" height="8"/><rect x="336" y="32" width="24" height="8"/><rect x="336" y="48" width="24" height="8"/>
    <rect x="0" y="100" width="24" height="540" opacity=".0"/>
  </g>
  <g fill="#b85c2c" opacity=".55"><rect x="0" y="64" width="24" height="576"/><rect x="336" y="64" width="24" height="576"/></g>
  <!-- spikes (pixel) -->
  <g fill="#ff4a4a">
    <rect x="24" y="112" width="8" height="24"/><rect x="32" y="118" width="8" height="12"/>
    <rect x="328" y="252" width="8" height="24"/><rect x="320" y="258" width="8" height="12"/>
    <rect x="24" y="452" width="8" height="24"/><rect x="32" y="458" width="8" height="12"/>
  </g>
  <!-- barriers -->
  <g fill="#3cc46a"><rect x="24" y="150" width="120" height="16"/><rect x="204" y="150" width="132" height="16"/><rect x="24" y="330" width="184" height="16"/><rect x="252" y="330" width="84" height="16"/></g>
  <g fill="#1d7a3c"><rect x="24" y="162" width="120" height="4"/><rect x="204" y="162" width="132" height="4"/><rect x="24" y="342" width="184" height="4"/><rect x="252" y="342" width="84" height="4"/></g>
  <!-- pixel bubble 8x8 grid of 6px -->
  <g fill="#7fe6ff">
    <rect x="216" y="426" width="24" height="6"/><rect x="204" y="432" width="12" height="6"/><rect x="240" y="432" width="12" height="6"/>
    <rect x="198" y="438" width="6" height="24"/><rect x="252" y="438" width="6" height="24"/>
    <rect x="204" y="462" width="12" height="6"/><rect x="240" y="462" width="12" height="6"/><rect x="216" y="468" width="24" height="6"/>
  </g>
  <g fill="#0b3a66" opacity=".8"><rect x="210" y="438" width="36" height="24"/></g>
  <g fill="#fff"><rect x="210" y="438" width="12" height="6"/><rect x="210" y="444" width="6" height="6"/></g>
  <!-- HUD -->
  <text x="40" y="52" fill="#ffe14a" font-size="20" font-weight="700">SCORE</text>
  <text x="40" y="78" fill="#fff" font-size="26" font-weight="700">000856</text>
  <text x="320" y="52" fill="#ffe14a" font-size="20" font-weight="700" text-anchor="end">HI</text>
  <text x="320" y="78" fill="#fff" font-size="26" font-weight="700" text-anchor="end">002310</text>
  <rect x="40" y="570" width="280" height="16" fill="none" stroke="#fff" stroke-width="4"/>
  <rect x="46" y="576" width="70" height="4" fill="#3cc46a"/>
  <rect x="46" y="576" width="70" height="4" fill="#3cc46a"/>
  <text x="180" y="616" fill="#7fe6ff" font-size="13" text-anchor="middle">HOLD: GROW   RELEASE: SHRINK</text>
  <text x="180" y="634" fill="#ffe14a" font-size="12" text-anchor="middle">INSERT COIN</text>
