<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd6e8"/><stop offset=".5" stop-color="#d7d9ff"/><stop offset="1" stop-color="#c2f0ff"/></linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9bd7ff"/></linearGradient>
  </defs>
  <rect width="360" height="640" fill="url(#bg)"/>
  <!-- soft shapes -->
  <circle cx="60" cy="230" r="70" fill="#fff" opacity=".35"/><circle cx="300" cy="420" r="90" fill="#fff" opacity=".3"/>
  <!-- glass bar top -->
  <rect x="20" y="24" width="320" height="64" rx="20" fill="#fff" opacity=".6"/>
  <text x="44" y="62" fill="#1f2340" font-size="28" font-weight="700">856 m</text>
  <rect x="220" y="40" width="100" height="32" rx="16" fill="#1f2340"/>
  <text x="270" y="61" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">Mejor 2.310</text>
  <!-- barriers -->
  <g fill="#1f2340"><rect x="0" y="150" width="140" height="18" rx="9"/><rect x="200" y="150" width="160" height="18" rx="9"/><rect x="0" y="330" width="210" height="18" rx="9"/><rect x="250" y="330" width="110" height="18" rx="9"/></g>
  <g fill="#ff5c8a"><circle cx="30" cy="252" r="10"/><circle cx="330" cy="240" r="10"/><circle cx="30" cy="440" r="10"/></g>
  <!-- player -->
  <circle cx="225" cy="452" r="30" fill="url(#b)"/>
  <circle cx="225" cy="452" r="30" fill="none" stroke="#fff" stroke-width="3" opacity=".9"/>
  <ellipse cx="215" cy="441" rx="8" ry="4" fill="#fff"/>
  <!-- meter -->
  <rect x="30" y="566" width="300" height="10" rx="5" fill="#fff" opacity=".7"/>
  <rect x="30" y="566" width="80" height="10" rx="5" fill="#1f2340"/>
  <text x="30" y="596" fill="#1f2340" font-size="12" font-weight="600">Rápida</text>
  <text x="330" y="596" fill="#1f2340" font-size="12" font-weight="600" text-anchor="end">Resistente</text>
  <rect x="80" y="606" width="200" height="8" rx="4" fill="none"/>
  <text x="180" y="626" fill="#4a4f7a" font-size="12" text-anchor="middle">Mantén para hinchar · suelta para encoger</text>
</svg>
