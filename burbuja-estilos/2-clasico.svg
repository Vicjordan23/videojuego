    <radialGradient id="b" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fffdf4"/><stop offset=".6" stop-color="#e8f0e6" stop-opacity=".7"/><stop offset="1" stop-color="#7fa39a" stop-opacity=".85"/></radialGradient>
  </defs>
  <rect width="360" height="640" fill="url(#bg)"/>
  <rect x="10" y="10" width="340" height="620" fill="none" stroke="#5a3f1f" stroke-width="3"/>
