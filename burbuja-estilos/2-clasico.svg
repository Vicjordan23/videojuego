    <rect x="41" y="330" width="170" height="16" rx="8"/><rect x="250" y="330" width="69" height="16" rx="8"/>
  </g>
  <g fill="#3b2510"><polygon points="41,112 58,124 41,136"/><polygon points="319,232 302,244 319,256"/></g>
