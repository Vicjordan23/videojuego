  <ellipse cx="216" cy="440" rx="8" ry="4" fill="#fff" opacity=".9"/>
  <!-- ornament small bubbles -->
  <g fill="none" stroke="#3b2510" stroke-width="1.5" opacity=".6"><circle cx="80" cy="240" r="6"/><circle cx="270" cy="280" r="8"/><circle cx="100" cy="420" r="5"/></g>
  <!-- HUD -->
  <text x="180" y="58" fill="#3b2510" font-size="14" text-anchor="middle" letter-spacing="4">PROFUNDIDAD</text>
  <text x="180" y="96" fill="#3b2510" font-size="34" font-weight="700" text-anchor="middle">856 brazas</text>
  <line x1="80" y1="106" x2="280" y2="106" stroke="#3b2510" stroke-width="1"/>
  <rect x="50" y="570" width="260" height="12" fill="none" stroke="#3b2510" stroke-width="2"/>
