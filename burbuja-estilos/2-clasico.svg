    <path d="M17 30l24 14M17 60l24 14M17 90l24 14M17 120l24 14M17 150l24 14M17 180l24 14M17 210l24 14M17 240l24 14M17 270l24 14M17 300l24 14M17 330l24 14M17 360l24 14M17 390l24 14M17 420l24 14M17 450l24 14M17 480l24 14M17 510l24 14M17 540l24 14M17 570l24 14"/>
    <path d="M343 30l-24 14M343 70l-24 14M343 110l-24 14M343 150l-24 14M343 190l-24 14M343 230l-24 14M343 270l-24 14M343 310l-24 14M343 350l-24 14M343 390l-24 14M343 430l-24 14M343 470l-24 14M343 510l-24 14M343 550l-24 14M343 590l-24 14"/>
