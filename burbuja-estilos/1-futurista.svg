<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" font-family="'Courier New',monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05010f"/><stop offset="1" stop-color="#150638"/></linearGradient>
    <radialGradient id="b" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".4" stop-color="#00f0ff" stop-opacity=".35"/><stop offset="1" stop-color="#7a3cff" stop-opacity=".6"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="360" height="640" fill="url(#bg)"/>
  <!-- grid -->
  <g stroke="#7a3cff" stroke-width="1" opacity=".25">
    <path d="M0 80H360M0 160H360M0 240H360M0 320H360M0 400H360M0 480H360M0 560H360"/>
    <path d="M60 0V640M120 0V640M180 0V640M240 0V640M300 0V640"/>
  </g>
  <!-- energy walls -->
  <rect x="0" y="0" width="10" height="640" fill="#00f0ff" filter="url(#glow)"/>
  <rect x="350" y="0" width="10" height="640" fill="#00f0ff" filter="url(#glow)"/>
  <!-- barriers -->
  <g fill="none" stroke="#ff2e93" stroke-width="4" filter="url(#glow)" stroke-linecap="round">
    <path d="M10 150H140M200 150H350"/><path d="M10 330H200M250 330H350"/>
  </g>
  <g fill="#ff2e93" filter="url(#glow)"><polygon points="10,110 28,122 10,134"/><polygon points="350,250 332,262 350,274"/><polygon points="10,450 28,462 10,474"/></g>
  <g fill="#00f0ff" font-size="10" text-anchor="middle"><text x="170" y="142">&lt; GAP 60 &gt;</text><text x="225" y="322">&lt; GAP 50 &gt;</text></g>
  <!-- player -->
  <circle cx="225" cy="450" r="30" fill="url(#b)" stroke="#00f0ff" stroke-width="2" filter="url(#glow)"/>
  <circle cx="225" cy="450" r="38" fill="none" stroke="#00f0ff" stroke-width="1" stroke-dasharray="3 5" opacity=".7"/>
  <path d="M225 490V520M215 495V515M235 495V515" stroke="#00f0ff" stroke-width="2" opacity=".5"/>
  <!-- HUD -->
  <text x="180" y="52" fill="#fff" font-size="30" text-anchor="middle" filter="url(#glow)">0856<tspan font-size="14" fill="#00f0ff"> M</tspan></text>
  <text x="180" y="72" fill="#7a3cff" font-size="11" text-anchor="middle" letter-spacing="3">ALTITUD</text>
  <rect x="30" y="572" width="300" height="10" fill="none" stroke="#00f0ff"/>
  <rect x="32" y="574" width="80" height="6" fill="#00f0ff" filter="url(#glow)"/>
  <text x="30" y="604" fill="#00f0ff" font-size="10">SMALL // FAST</text>
  <text x="330" y="604" fill="#00f0ff" font-size="10" text-anchor="end">LARGE // SHIELD</text>
  <text x="180" y="630" fill="#c8b6ff" font-size="11" text-anchor="middle" letter-spacing="1">HOLD = EXPAND · RELEASE = COMPRESS</text>
</svg>
