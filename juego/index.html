<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Burbuja Cero</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
  html, body { height: 100%; margin: 0; background: #2a2a55; overflow: hidden; overscroll-behavior: none; }
  body { display: flex; align-items: center; justify-content: center; box-sizing: border-box; color: #fff; font-family: 'Fredoka', 'Trebuchet MS', Verdana, sans-serif; }
  canvas { display: block; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; background: #4c9bff; border-radius: 12px; }
</style>
</head>
<body>
<canvas id="c" aria-label="Burbuja Cero: arrastra para mover la burbuja y mantén el botón Hinchar para crecer"></canvas>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="config.js"></script>
<script>
(() => {
  'use strict';
  const CFG = Object.assign({ MONETAG_ZONE: '', MONETAG_SDK_URL: '', INTERSTITIAL_EVERY: 4, SHARE_URL: '' }, window.BC_CONFIG || {});
  const W = 360, H = 640, WALL = 20, X0 = 180, HALF = 160, BY = 440, R_MIN = 14, R_MAX = 42;
  const FONT = "'Fredoka','Trebuchet MS',Verdana,sans-serif", TAU = Math.PI * 2;
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const easeBack = t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

  // ================= Telegram =================
  const TG = window.Telegram && window.Telegram.WebApp;
  const inTG = !!(TG && TG.initData);
  const tgUser = inTG && TG.initDataUnsafe && TG.initDataUnsafe.user;
  const tgOk = v => { try { return inTG && TG.isVersionAtLeast(v); } catch (e) { return false; } };
  if (inTG) {
    try { TG.ready(); TG.expand(); } catch (e) {}
    try { if (tgOk('7.7')) TG.disableVerticalSwipes(); } catch (e) {}
    try { if (tgOk('8.0') && (TG.platform === 'android' || TG.platform === 'ios')) TG.requestFullscreen(); } catch (e) {}
    try { TG.setHeaderColor('#8fe3ff'); TG.setBackgroundColor('#2a2a55'); } catch (e) {}
  }
  function haptic(kind) {
    try {
      if (inTG && TG.HapticFeedback) {
        if (kind === 'error' || kind === 'success') TG.HapticFeedback.notificationOccurred(kind);
        else if (kind === 'tick') TG.HapticFeedback.selectionChanged();
        else TG.HapticFeedback.impactOccurred(kind);
      } else if (navigator.vibrate) navigator.vibrate(kind === 'heavy' ? 120 : kind === 'medium' ? 60 : 20);
    } catch (e) {}
  }

  // ================= Guardado (local + nube de Telegram) =================
  const KEYS = ['best', 'stars', 'owned', 'skin', 'tut', 'muted', 'games'];
  const store = {
    get(k, d) { try { const v = localStorage.getItem('bc_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) {
      try { localStorage.setItem('bc_' + k, JSON.stringify(v)); } catch (e) {}
      try { if (inTG && tgOk('6.9')) TG.CloudStorage.setItem('bc_' + k, JSON.stringify(v)); } catch (e) {}
    }
  };
  let best = store.get('best', 0), stars = store.get('stars', 0), games = store.get('games', 0);
  let owned = store.get('owned', ['clasica']), skinId = store.get('skin', 'clasica'), muted = store.get('muted', false);
  if (inTG && tgOk('6.9')) {
    try {
      TG.CloudStorage.getItems(KEYS.map(k => 'bc_' + k), (err, vals) => {
        if (err || !vals) return;
        const g = k => { try { return vals['bc_' + k] ? JSON.parse(vals['bc_' + k]) : undefined; } catch (e) { return undefined; } };
        if (g('best') !== undefined) best = Math.max(best, g('best'));
        if (g('stars') !== undefined) stars = g('stars');
        if (g('games') !== undefined) games = Math.max(games, g('games'));
        if (g('owned')) owned = Array.from(new Set(owned.concat(g('owned'))));
        if (g('skin')) skinId = g('skin');
        if (g('muted') !== undefined) { muted = g('muted'); if (master) master.gain.value = muted ? 0 : 1; }
        if (g('tut')) store.set('tut', true);
      });
    } catch (e) {}
  }

  // ================= Pantalla =================
  let scale = 1;
  function layout() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    let top = 0;
    if (inTG) {
      const a = TG.safeAreaInset || {}, b = TG.contentSafeAreaInset || {};
      top = (a.top || 0) + (b.top || 0);
    }
    document.body.style.paddingTop = top + 'px';
    const s = Math.min(window.innerWidth / W, (window.innerHeight - top) / H);
    cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
    cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr);
    scale = s * dpr;
  }
  window.addEventListener('resize', layout); layout();
  if (inTG) ['viewportChanged', 'safeAreaChanged', 'contentSafeAreaChanged', 'fullscreenChanged'].forEach(ev => { try { TG.onEvent(ev, layout); } catch (e) {} });

  // ================= Sonido y música =================
  let actx = null, master = null, musicGain = null, musicTimer = null, nextNote = 0, mstep = 0, lastMel = 2;
  function initAudio() {
    if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain(); master.gain.value = muted ? 0 : 1; master.connect(actx.destination);
      musicGain = actx.createGain(); musicGain.gain.value = 0.5; musicGain.connect(master);
    } catch (e) { actx = null; }
  }
  function tone(f, d, type, vol, slide, dest, when) {
    if (!actx) return;
    const o = actx.createOscillator(), g = actx.createGain(), t = when || actx.currentTime;
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(dest || master); o.start(t); o.stop(t + d + 0.05);
  }
  const PENTA = [0, 2, 4, 7, 9, 12, 14, 16], BASS = [0, -3, -7, -5];
  function sched() {
    if (!actx || state !== 'play' || paused) return;
    const beat = 0.24;
    while (nextNote < actx.currentTime + 0.35) {
      const bar = Math.floor(mstep / 8) % 4;
      if (mstep % 8 === 0) tone(130.8 * Math.pow(2, BASS[bar] / 12), beat * 3.6, 'sine', 0.22, 0, musicGain, nextNote);
      if (Math.random() < 0.72) {
        lastMel = clamp(lastMel + Math.round(rnd(-2, 2)), 0, PENTA.length - 1);
        tone(523.25 * Math.pow(2, (PENTA[lastMel] + BASS[bar]) / 12), beat * 1.6, 'triangle', 0.1, 0, musicGain, nextNote);
      }
      nextNote += beat; mstep++;
    }
  }
  function startMusic() { stopMusic(); if (!actx) return; nextNote = actx.currentTime + 0.05; mstep = 0; musicTimer = setInterval(sched, 120); }
  function stopMusic() { if (musicTimer) { clearInterval(musicTimer); musicTimer = null; } }
  const sfx = (f, d, type, vol, slide) => tone(f, d, type, vol, slide);
  function toggleMute() { muted = !muted; store.set('muted', muted); if (master) master.gain.value = muted ? 0 : 1; }

  // ================= Anuncios (Monetag) =================
  const adsConfigured = !!(CFG.MONETAG_ZONE && CFG.MONETAG_SDK_URL);
  if (adsConfigured) {
    const sc = document.createElement('script');
    sc.src = CFG.MONETAG_SDK_URL; sc.dataset.zone = CFG.MONETAG_ZONE; sc.dataset.sdk = 'show_' + CFG.MONETAG_ZONE;
    document.head.appendChild(sc);
  }
  let adSim = null, adReturn = 'over', toastMsg = '', toastT = 0;
  function toast(m) { toastMsg = m; toastT = 2.2; }
  // Devuelve una promesa: true si el usuario completó el anuncio.
  function showAd() {
    return new Promise(resolve => {
      adReturn = state; state = 'ad'; stopMusic(); if (master) master.gain.value = 0;
      let finished = false;
      const done = ok => {
        if (finished) return; finished = true; adSim = null;
        state = adReturn; if (master) master.gain.value = muted ? 0 : 1;
        if (!ok) toast('Anuncio no disponible');
        resolve(ok);
      };
      const fn = window['show_' + CFG.MONETAG_ZONE];
      if (adsConfigured && typeof fn === 'function') {
        try { fn().then(() => done(true)).catch(() => done(false)); } catch (e) { done(false); }
      } else adSim = { t: 2.5, cb: done };   // modo prueba: sin zona configurada
    });
  }

  // ================= Burbujas jugables =================
  const SKINS = [
    { id: 'clasica', name: 'Clásica', cost: 0, desc: 'Equilibrada', shield: 30, tint: '190,235,255' },
    { id: 'jabon', name: 'Jabón', cost: 25, desc: 'Escudo antes', shield: 22, tint: '215,205,255' },
    { id: 'gas', name: 'Gas', cost: 50, desc: 'Imán de estrellas', shield: 30, magnet: 110, tint: '190,245,175' }
  ];
  const skin = () => SKINS.find(s => s.id === skinId) || SKINS[0];

  // ================= Estado del juego =================
  let state = 'menu', paused = false, tutStep = 0, overTimer = 0, time = 0, stateT = 0;
  let keyL = false, keyR = false, keyInflate = false;
  let bub, barriers, spikes, winds, pickups, parts, dist, passed, runStars, sinceSpawn, shake, spacing, reviveUsed, doubleUsed, newRecord;
  const layers = [
    ...Array.from({ length: 5 }, () => ({ l: 0, x: rnd(0, W), y: rnd(0, H), s: rnd(.5, .8) })),
    ...Array.from({ length: 4 }, () => ({ l: 1, x: rnd(0, W), y: rnd(0, H), s: rnd(.9, 1.3) })),
    ...Array.from({ length: 2 }, () => ({ l: 2, x: rnd(0, W), y: rnd(0, H), s: rnd(1.8, 2.6) }))
  ];
  const floaters = Array.from({ length: 14 }, () => ({ x: rnd(40, 320), y: rnd(0, H), r: rnd(2, 7), ph: rnd(0, 6) }));

  function reset() {
    bub = { x: X0, tx: X0, y: BY, r: R_MIN, invuln: 0, hurt: 0, dir: 1, vx: 0, sq: 0, sqv: 0, lastX: X0 };
    barriers = []; spikes = []; winds = []; pickups = []; parts = [];
    dist = 0; passed = 0; runStars = 0; shake = 0; spacing = 260; sinceSpawn = spacing - 200;
    reviveUsed = false; doubleUsed = false; newRecord = false;
  }
  reset();
  const speed = () => Math.min(230, 105 + dist * 0.4);
  const isBig = () => bub.r > skin().shield;
  const sc = y => 0.82 + 0.18 * clamp(y / BY, -0.2, 1.4);   // perspectiva: lo lejano es más estrecho

  function spawn() {
    const base = Math.max(84, 150 - dist * 0.25), gw = base + rnd(0, 30), half = gw / 2;
    const gx = rnd(WALL + half + 6, W - WALL - half - 6);
    barriers.push({ y: -30, gx, gw, done: false });
    pickups.push({ x: gx, y: -80, got: false, ph: rnd(0, 6) });
    const mid = -30 - spacing / 2, roll = Math.random();
    if (dist > 25 && roll < 0.33) winds.push({ y: mid - 80, h: 160, dir: Math.random() < 0.5 ? -1 : 1 });
    else if (roll < 0.6) spikes.push({ y: mid, side: Math.random() < 0.5 ? -1 : 1, sucked: false, sx: 0, sy: 0, sc: 1 });
    if (Math.random() < 0.5) {
      const sx = rnd(60, W - 60);
      for (let i = -1; i <= 1; i++) pickups.push({ x: sx + i * 30, y: mid - Math.abs(i) * 14 + 30, got: false, ph: rnd(0, 6) });
    }
  }
  function circleRect(cx, cy, r, x, y, w, h) {
    const nx = clamp(cx, x, x + w), ny = clamp(cy, y, y + h), dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }
  function burst(x, y, n, colors, glow) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, v = rnd(60, 240);
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rnd(0.4, 0.9), r: rnd(2, 6), c: colors[i % colors.length], glow: !!glow });
    }
  }

  function start() {
    initAudio(); reset(); state = 'play'; stateT = 0; paused = false; ptrs.clear(); startMusic();
    try { if (inTG && tgOk('6.2')) TG.enableClosingConfirmation(); } catch (e) {}
  }
  function play() {
    initAudio();
    if (!store.get('tut', false)) { state = 'tut'; tutStep = 0; stateT = 0; ptrs.clear(); } else start();
  }
  function die() {
    state = 'over'; stateT = 0; overTimer = 0.6; stopMusic();
    burst(bub.x, bub.y, 26, ['#fff', '#8fe3ff', '#ff8fc7'], true);
    sfx(520, 0.35, 'triangle', 0.2, 90); haptic('error');
    const score = Math.floor(dist);
    if (score > best) { best = score; newRecord = score > 0; store.set('best', best); }
    games++; store.set('games', games); store.set('stars', stars);
    try { if (inTG && tgOk('6.2')) TG.disableClosingConfirmation(); } catch (e) {}
  }
  function hit() {
    if (bub.invuln > 0) return;
    if (isBig()) {
      bub.r = R_MIN; bub.invuln = 1.4; bub.hurt = 0.7; shake = 0.35; bub.sq = -0.4;
      burst(bub.x, bub.y, 14, ['#fff', '#ff8fc7'], true);
      sfx(300, 0.25, 'square', 0.12, 120); haptic('medium');
    } else die();
  }
  function revive() {
    reviveUsed = true; state = 'play'; stateT = 0; ptrs.clear();
    bub.r = R_MIN; bub.invuln = 3; bub.hurt = 0; bub.sq = .3;
    spikes = spikes.filter(s => Math.abs(s.y - bub.y) > 200);
    burst(bub.x, bub.y, 18, ['#fff', '#ffd84a'], true);
    haptic('success'); startMusic();
  }

  // ================= Entrada =================
  const ptrs = new Map(), BTN = { x: 288, y: 566, r: 50 };
  const gp = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; };
  const inBox = (p, x, y, w, h) => p.x >= x && p.x <= x + w && p.y >= y && p.y <= y + h;
  const SKIN_BOX = i => [24 + i * 112, 300, 100, 124];
  const hasRevive = () => !reviveUsed;
  const hasDouble = () => !doubleUsed && runStars > 0;

  function menuTap(p) {
    if (inBox(p, 60, 516, 240, 60)) { play(); return; }
    if (inBox(p, 246, 18, 44, 44)) { initAudio(); state = 'tut'; tutStep = 0; stateT = 0; return; }
    SKINS.forEach((s, i) => {
      if (!inBox(p, ...SKIN_BOX(i).slice(0, 2), 100, 124)) return;
      initAudio();
      if (owned.includes(s.id)) { skinId = s.id; store.set('skin', skinId); sfx(700, 0.1, 'sine', 0.12); haptic('tick'); }
      else if (stars >= s.cost) {
        stars -= s.cost; owned.push(s.id); skinId = s.id;
        store.set('stars', stars); store.set('owned', owned); store.set('skin', skinId); sfx(880, 0.3, 'triangle', 0.15, 1320); haptic('success');
      } else { sfx(180, 0.15, 'square', 0.08); haptic('error'); toast('Te faltan ' + (s.cost - stars) + ' estrellas'); }
    });
  }
  function overTap(p) {
    if (overTimer > 0) return;
    if (hasRevive() && inBox(p, 50, 388, 260, 50)) { showAd().then(ok => { if (ok) revive(); }); return; }
    if (hasDouble() && inBox(p, 50, 446, 260, 46)) {
      showAd().then(ok => { if (ok) { stars += runStars; runStars *= 2; doubleUsed = true; store.set('stars', stars); haptic('success'); sfx(880, .3, 'triangle', .15, 1320); } });
      return;
    }
    if (inBox(p, 50, 504, 260, 56)) {
      if (CFG.INTERSTITIAL_EVERY > 0 && games % CFG.INTERSTITIAL_EVERY === 0) showAd().then(() => start()); else start();
      return;
    }
    if (inBox(p, 50, 572, CFG.SHARE_URL ? 120 : 260, 40)) { reset(); state = 'menu'; stateT = 0; return; }
    if (CFG.SHARE_URL && inBox(p, 190, 572, 120, 40)) share();
  }
  function share() {
    const url = 'https://t.me/share/url?url=' + encodeURIComponent(CFG.SHARE_URL) + '&text=' + encodeURIComponent('Llegué a ' + Math.floor(dist) + ' m en Burbuja Cero. ¿Me superas?');
    try { if (inTG) TG.openTelegramLink(url); else window.open(url, '_blank'); } catch (e) {}
  }
  function tutNext() { if (tutStep < 2) { tutStep++; stateT = 0; haptic('tick'); } else { store.set('tut', true); start(); } }

  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    const p = gp(e);
    if (paused) { paused = false; if (state === 'play') startMusic(); return; }
    if (state === 'ad') return;
    if (inBox(p, 296, 14, 44, 44)) { initAudio(); toggleMute(); return; }
    if (state === 'menu') return menuTap(p);
    if (state === 'tut') { if (inBox(p, 60, 520, 240, 56)) tutNext(); return; }
    if (state === 'over') return overTap(p);
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    if (e.pointerType === 'mouse') { ptrs.set(e.pointerId, { zone: 'inflate' }); bub.tx = p.x; }
    else ptrs.set(e.pointerId, { zone: Math.hypot(p.x - BTN.x, p.y - BTN.y) < BTN.r + 10 ? 'inflate' : 'move', lx: p.x });
  });
  cv.addEventListener('pointermove', e => {
    if (state !== 'play') return;
    const p = gp(e);
    if (e.pointerType === 'mouse') { bub.tx = p.x; return; }
    const q = ptrs.get(e.pointerId);
    if (q && q.zone === 'move') { bub.tx += (p.x - q.lx) * 1.8; q.lx = p.x; }
  });
  const up = e => ptrs.delete(e.pointerId);
  window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
  window.addEventListener('keydown', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keyL = true;
    else if (e.code === 'ArrowRight' || e.code === 'KeyD') keyR = true;
    else if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault(); keyInflate = true;
      if (e.repeat) return;
      if (state === 'menu') play(); else if (state === 'tut') tutNext(); else if (state === 'over' && overTimer <= 0) start();
      else if (paused) { paused = false; startMusic(); }
    }
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keyL = false;
    else if (e.code === 'ArrowRight' || e.code === 'KeyD') keyR = false;
    else if (e.code === 'Space' || e.code === 'ArrowUp') keyInflate = false;
  });
  function clearInput() { ptrs.clear(); keyL = keyR = keyInflate = false; }
  window.addEventListener('blur', clearInput);
  document.addEventListener('visibilitychange', () => { if (document.hidden) { clearInput(); if (state === 'play') { paused = true; stopMusic(); } } });
  const isHolding = () => keyInflate || [...ptrs.values()].some(q => q.zone === 'inflate');

  // ================= Actualización =================
  function update(dt) {
    time += dt; stateT += dt;
    if (toastT > 0) toastT -= dt;
    if (state === 'ad') { if (adSim) { adSim.t -= dt; if (adSim.t <= 0) adSim.cb(true); } return; }
    if (paused) return;
    const sp = state === 'play' ? speed() : 40;
    layers.forEach(c => {
      c.y += sp * (c.l === 0 ? 0.08 : c.l === 1 ? 0.2 : 0.9) * dt;
      if (c.y > H + 80) { c.y = -80; c.x = rnd(0, W); }
    });
    floaters.forEach(f => { f.y += sp * 0.45 * dt; if (f.y > H + 10) { f.y = -10; f.x = rnd(40, 320); } });
    parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 200 * dt; p.life -= dt; });
    parts = parts.filter(p => p.life > 0);
    if (shake > 0) shake -= dt;
    // resorte de la burbuja (aplastamiento)
    bub.sqv += (-90 * bub.sq - 9 * bub.sqv) * dt; bub.sq += bub.sqv * dt;
    if (state === 'over') { overTimer -= dt; return; }
    if (state === 'tut') return;
    if (state === 'menu') { bub.x = X0; bub.y = 232 + Math.sin(time * 2) * 6; bub.r = 30; return; }

    const holding = isHolding();
    const target = holding ? R_MAX : R_MIN, rate = holding ? 70 : 130;
    bub.r = bub.r < target ? Math.min(target, bub.r + rate * dt) : Math.max(target, bub.r - rate * dt);
    if (bub.invuln > 0) bub.invuln -= dt;
    if (bub.hurt > 0) bub.hurt -= dt;

    const k = (bub.r - R_MIN) / (R_MAX - R_MIN), cap = 520 - 220 * k;
    if (keyL) bub.tx -= 380 * dt;
    if (keyR) bub.tx += 380 * dt;
    bub.tx = clamp(bub.tx, WALL + R_MIN, W - WALL - R_MIN);
    const stepX = clamp(bub.tx - bub.x, -cap * dt, cap * dt);
    if (Math.abs(stepX) > 0.1) bub.dir = stepX > 0 ? 1 : -1;
    bub.x += stepX;
    for (const w of winds) if (bub.y > w.y && bub.y < w.y + w.h) { const push = w.dir * 75 * (1.3 - 0.6 * k) * dt; bub.x += push; bub.tx += push; }
    bub.x = clamp(bub.x, WALL + bub.r, W - WALL - bub.r);
    bub.vx += ((bub.x - bub.lastX) / dt - bub.vx) * Math.min(1, dt * 12); bub.lastX = bub.x;

    dist += sp * dt / 12; sinceSpawn += sp * dt;
    if (sinceSpawn >= spacing) { sinceSpawn -= spacing; spawn(); }
    for (const list of [barriers, spikes, winds, pickups]) list.forEach(o => { o.y += sp * dt; if (o.sucked) o.sy += sp * dt; });
    barriers = barriers.filter(b => b.y < H + 40); winds = winds.filter(w => w.y < H + 40);
    pickups = pickups.filter(p => !p.got && p.y < H + 40); spikes = spikes.filter(s => s.y < H + 40);

    const mg = Math.max(skin().magnet || 0, isBig() ? 90 + k * 150 : 0);
    for (const p of pickups) {
      const ddx = bub.x - p.x, ddy = bub.y - p.y, d = Math.hypot(ddx, ddy);

      const ph = (t * 0.5) % 1, r = ph < 0.35 ? 34 - ph / 0.35 * 20 : 14, y = ph < .35 ? 140 : 150 - clamp((ph - 0.3) / 0.6, 0, 1) * 130;
      drawBubbleAt(70, y, r, sk, {});
      text(ph < .35 ? 'suelta' : '¡pasa!', 175, 60, 20, '#2a2a55');
    }
    ctx.restore();
  }
  function drawTut() {
    ctx.fillStyle = 'rgba(30,30,80,.55)'; ctx.fillRect(0, 0, W, H);
    const p = easeBack(Math.min(1, stateT / .3)); ctx.save(); ctx.translate(X0, 320); ctx.scale(p, p); ctx.translate(-X0, -320);
    panel(30, 60, 300, 540);
    text(['1  Mover', '2  Hinchar', '3  Encoger'][tutStep], 180, 110, 32, '#ff5c9a');
    tutScene(tutStep, 50, 130);
    [['Arrastra el dedo por la pantalla', 'y la burbuja te sigue.'], ['Mantén el botón HINCHAR con', 'el otro pulgar: atraes estrellas', 'y te tragas los pinchos.'], ['Suelta el botón y encoges:', 'así pasas por los huecos', 'estrechos de las barreras.']][tutStep]
      .forEach((l, i) => text(l, 180, 340 + i * 26, 18, '#2a2a55', 'center', 500));
    for (let i = 0; i < 3; i++) { ctx.fillStyle = i === tutStep ? '#ff5c9a' : '#d6d4ea'; ctx.beginPath(); ctx.arc(150 + i * 30, 470, 6, 0, TAU); ctx.fill(); }
    btn(60, 520, 240, 56, tutStep < 2 ? 'Siguiente' : '¡A jugar!', '#ff86bb', '#e0287c', 22);
    ctx.restore();
  }
  function drawMenu() {
    starChip(24, 20, 100, stars);
    circleBtn(268, 36, '?', false);
    text3d('Burbuja Cero', 180, 118, 42, '#fff', '#d63a83', 6);
    text('Sube sin reventar', 180, 148, 17, '#fff', 'center', 500);
    if (tgUser && tgUser.first_name) text('Hola, ' + tgUser.first_name, 180, 172, 16, '#fff', 'center', 500);
    if (best) text('Mejor: ' + best + ' m', 180, tgUser ? 192 : 176, 16, '#fff', 'center', 600);
    // burbuja de escaparate con sombra en el suelo
    ctx.fillStyle = 'rgba(20,40,120,.2)'; ctx.beginPath(); ctx.ellipse(X0, 290, 34 - (bub.y - 232) * 1.5, 7, 0, 0, TAU); ctx.fill();
    drawBubbleAt(bub.x, bub.y, bub.r, skin(), { dir: Math.sin(time), squash: { rot: Math.sin(time * 1.5) * .06, sx: 1 + Math.sin(time * 4) * .02, sy: 1 - Math.sin(time * 4) * .02 } });
    SKINS.forEach((s, i) => {
      const [x, y, w, h] = SKIN_BOX(i), has = owned.includes(s.id), sel = skinId === s.id;
      panel(x, y, w, h, sel ? '#fff' : 'rgba(255,255,255,.78)');
      if (sel) { ctx.strokeStyle = '#ff5c9a'; ctx.lineWidth = 4; rr(x, y, w, h, 24); ctx.stroke(); }
      drawBubbleAt(x + w / 2, y + 36, 20, s, {});
      text(s.name, x + w / 2, y + 78, 16, '#2a2a55'); text(s.desc, x + w / 2, y + 94, 11, '#5c5b8a', 'center', 500);
      text(sel ? 'Elegida' : has ? 'Usar' : '★ ' + s.cost, x + w / 2, y + 115, 14, has ? '#ff5c9a' : (stars >= s.cost ? '#c98a00' : '#8a88b0'));
    });
    btn(60, 516, 240, 60, 'Jugar', '#ff86bb', '#e0287c', 28);
    text('Recoge estrellas para desbloquear burbujas', 180, 616, 13, '#fff', 'center', 500);
  }
  function drawOver() {
    ctx.fillStyle = 'rgba(30,30,80,.35)'; ctx.fillRect(0, 0, W, H);
    const p = easeBack(Math.min(1, stateT / .3)); ctx.save(); ctx.translate(X0, 320); ctx.scale(p, p); ctx.translate(-X0, -320);
    panel(40, 70, 280, 300);
    text3d('¡Pop!', 180, 128, 38, '#ff5c9a', '#c02a70', 4);
    text(Math.floor(dist) + ' m', 180, 190, 46, '#2a2a55');
    text('Mejor: ' + best + ' m', 180, 218, 16, '#5c5b8a', 'center', 500);
    text('Barreras pasadas: ' + passed, 180, 242, 14, '#5c5b8a', 'center', 500);
    star3d(146, 280, 11, 0, true); text('+' + runStars + '   (total ' + stars + ')', 166, 287, 18, '#2a2a55', 'left');
    if (newRecord) { btn(100, 310, 160, 36, '¡Nuevo récord!', '#ffd84a', '#e59a00', 16, '#5a3b00'); }
    if (overTimer <= 0) {
      if (hasRevive()) btn(50, 388, 260, 50, '▶ Revivir  ·  ver anuncio', '#5be3a8', '#1fa872', 17);
      if (hasDouble()) btn(50, 446, 260, 46, '▶ Estrellas x2  ·  ver anuncio', '#ffcf5a', '#e08a00', 16);
      btn(50, 504, 260, 56, 'Otra vez', '#ff86bb', '#e0287c', 24);
      btn(50, 572, CFG.SHARE_URL ? 120 : 260, 40, 'Menú', '#a9b4ff', '#6a76e0', 16);
      if (CFG.SHARE_URL) btn(190, 572, 120, 40, 'Compartir', '#7fd6ff', '#2f9fe0', 16);
    }
    ctx.restore();
  }

  function draw() {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.save();
    if (shake > 0) ctx.translate(rnd(-4, 4), rnd(-4, 4));
    drawBackground(); drawWalls();
    winds.forEach(drawWind);
    const objs = [...barriers.map(o => [o.y, () => drawBarrier(o)]), ...spikes.map(o => [o.y, () => drawSpike(o)]), ...pickups.map(o => [o.y, () => persp(o.y, () => star3d(o.x, o.y, 11, o.ph))])];
    objs.sort((a, b) => a[0] - b[0]).forEach(o => o[1]());
    drawParts();
    if (state === 'play' || state === 'ad' || (state === 'over' && overTimer > .55)) drawPlayer();
    layers.filter(c => c.l === 2).forEach(c => cloud(c.x, c.y, c.s, .3, '#c6e0ff'));
    const fog = ctx.createLinearGradient(0, 0, 0, 200); fog.addColorStop(0, 'rgba(200,240,255,.55)'); fog.addColorStop(1, 'rgba(200,240,255,0)');
    ctx.fillStyle = fog; ctx.fillRect(0, 0, W, 200);
    if (state === 'play' && speed() > 150) {
      ctx.strokeStyle = 'rgba(255,255,255,' + clamp((speed() - 150) / 300, 0, .3) + ')'; ctx.lineWidth = 2;
      for (let i = 0; i < 8; i++) { const x = (i % 2 ? 40 : W - 40) + Math.sin(i * 9) * 14, y = ((time * 500 + i * 83) % 700) - 30; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 40); ctx.stroke(); }
    }
    ctx.restore();

    if (state === 'play' || state === 'ad' && adReturn === 'play') {
      panel(110, 22, 140, 52); text(Math.floor(dist) + ' m', 180, 59, 30, '#2a2a55');
      starChip(20, 30, 82, runStars);
      drawButton();
      if (isBig()) btn(105, 84, 150, 30, '¡Imán activo!', '#ff86bb', '#e0287c', 15);
      ctx.globalAlpha = dist < 60 ? 0.95 : 0.4; text('☝ arrastra para mover', 100, 612, 14, '#fff', 'center', 500); ctx.globalAlpha = 1;
    }
    if (state !== 'over' && state !== 'tut') circleBtn(318, 36, '♪', muted);
    if (state === 'menu') drawMenu();
    if (state === 'tut') drawTut();
    if (state === 'over') drawOver();
    if (paused) {
      ctx.fillStyle = 'rgba(30,30,80,.6)'; ctx.fillRect(0, 0, W, H);
      text3d('Pausa', 180, 300, 44, '#fff', '#d63a83', 5); text('Toca para seguir', 180, 345, 20, '#fff', 'center', 500);
    }
    if (state === 'ad') {
      ctx.fillStyle = 'rgba(30,30,80,.7)'; ctx.fillRect(0, 0, W, H);
      if (adSim) {
        panel(50, 240, 260, 150);
        text('Anuncio de prueba', 180, 290, 22, '#2a2a55'); text('Sin zona Monetag configurada', 180, 318, 13, '#5c5b8a', 'center', 500);
        text(Math.ceil(adSim.t) + ' s', 180, 365, 36, '#ff5c9a');
      } else text('Cargando anuncio…', 180, 320, 22, '#fff');
    }
    if (toastT > 0) {
      ctx.globalAlpha = clamp(toastT, 0, 1); panel(60, 540, 240, 40, 'rgba(42,42,85,.92)'); text(toastMsg, 180, 566, 15, '#fff', 'center', 500); ctx.globalAlpha = 1;
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    update(dt); draw(); requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
