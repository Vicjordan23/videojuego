<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ideas de videojuego endless</title>
<style>
  :root { --bg:#f5f4fa; --fg:#1d1a2e; --muted:#5c5877; --card:#ffffff; --line:#dcd8ec; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121022; --fg:#efedfa; --muted:#a29cc4; --card:#1c1934; --line:#2f2b52; } }
  body { margin:0; padding:24px 16px; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,sans-serif; }
  main { max-width:1200px; margin:0 auto; }
  h1 { margin:0 0 4px; font-size:1.8rem; }
  p.sub { margin:0 0 24px; color:var(--muted); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; }
  figure { margin:0; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; }
  img { width:100%; height:auto; display:block; border-radius:10px; }
  figcaption { margin-top:8px; font-weight:600; }
  figcaption span { display:block; font-weight:400; color:var(--muted); font-size:.9rem; }
</style>
</head>
<body>
<main>
  <h1>Ideas de videojuego endless</h1>
  <p class="sub">Cinco mockups en formato móvil. Los detalles de cada juego están en el README.</p>
  <div class="grid">
    <figure><img src="mockups/1-fantasma-de-ayer.svg" alt="Mockup de Fantasma de Ayer"><figcaption>1. Fantasma de Ayer<span>Tus partidas pasadas son los enemigos.</span></figcaption></figure>
    <figure><img src="mockups/2-merge-rush.svg" alt="Mockup de Merge Rush"><figcaption>2. Merge Rush<span>Elige puertas y haz crecer tu número.</span></figcaption></figure>
    <figure><img src="mockups/3-jardin-en-caida.svg" alt="Mockup de Jardín en Caída"><figcaption>3. Jardín en Caída<span>Puzzle de flores contra la maleza.</span></figcaption></figure>
    <figure><img src="mockups/4-burbuja-cero.svg" alt="Mockup de Burbuja Cero"><figcaption>4. Burbuja Cero<span>Hincha o encoge para subir.</span></figcaption></figure>
    <figure><img src="mockups/5-marea-alta.svg" alt="Mockup de Marea Alta"><figcaption>5. Marea Alta<span>Surf rítmico entre aire y agua.</span></figcaption></figure>
  </div>
</main>
</body>
</html>
